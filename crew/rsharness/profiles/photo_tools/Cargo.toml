# The fixed crate every photo_tools crew job compiles in. Members never see or change
# it: they write one src/<module>.rs (or one tests/<name>.rs), and rsrun.py writes
# src/lib.rs as `pub mod` lines for the modules in play. No build.rs, no proc-macro
# crates beyond clap's derive, and cargo runs --offline --locked against Cargo.lock.
[package]
name = "photo_tools"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
doctest = false

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "=0.27.0", default-features = false }
clap = { version = "=4.6.7", features = ["derive"] }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
