# The fixed crate every the_crew crew job compiles in (The Crew control room and its
# guards, 2026-10-23). Pure std: no dependencies at all. Members never see or change it:
# they write one src/<module>.rs (or one tests/<name>.rs), and rsrun.py writes src/lib.rs
# as `pub mod` lines for the modules in play. cargo runs --offline --locked.
[package]
name = "the_crew"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
doctest = false

[dependencies]

[profile.dev]
debug = 0
opt-level = 1
